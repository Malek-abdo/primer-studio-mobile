<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Primer Studio</title>
<style>
:root{--bg:#090a0e;--panel:#12141a;--panel2:#1b1e27;--line:#292e3a;--text:#f5f6f8;--muted:#9199aa;--purple:#8c5cf5;--cyan:#41d1d8;--red:#ff5e73}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Tahoma,Arial}button,input{font:inherit}button{color:inherit;border:0;cursor:pointer}.hidden{display:none!important}.app{min-height:100vh;background:radial-gradient(circle at 75% -10%,#2a1c48,transparent 35%)}.top{height:62px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#0d0e13e8;backdrop-filter:blur(16px);position:sticky;top:0;z-index:5}.brand{display:flex;gap:10px;align-items:center;font-weight:800}.logo{width:29px;height:29px;border-radius:9px;background:linear-gradient(135deg,var(--purple),var(--cyan));color:#0b0c11;display:grid;place-items:center}.top-actions{display:flex;gap:8px}.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 14px}.primary{background:var(--purple);border-color:transparent;font-weight:700}.danger{color:#ff8e9b}.home{padding:30px;max-width:1120px;margin:auto}.hero{display:flex;align-items:end;justify-content:space-between;margin-bottom:26px}.eyebrow{color:var(--cyan);font-size:12px;font-weight:700;letter-spacing:1px}.hero h1{font-size:34px;margin:8px 0 4px}.hero p{color:var(--muted);margin:0}.projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:15px}.project{min-height:185px;border:1px solid var(--line);background:linear-gradient(145deg,#191b24,#101217);border-radius:16px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;transition:.2s}.project:hover{border-color:#7150c5;transform:translateY(-2px)}.thumb{height:86px;border-radius:11px;background:linear-gradient(135deg,#34205d,#163e51);display:flex;align-items:center;justify-content:center;font-size:30px;color:#ffffffaa}.project h3{font-size:15px;margin:12px 0 4px}.project small{color:var(--muted)}.project-actions{display:flex;gap:7px;margin-top:12px}.project-actions button{flex:1;padding:8px;border-radius:8px;background:#242835;color:#cbd0db;font-size:12px}.empty{border:1px dashed #394052;border-radius:16px;padding:48px 20px;text-align:center;color:var(--muted);grid-column:1/-1}.empty b{display:block;color:#fff;font-size:18px;margin-bottom:8px}.editor{height:calc(100vh - 62px);display:grid;grid-template-columns:250px minmax(330px,1fr) 285px;grid-template-rows:minmax(0,1fr) 190px;gap:1px;background:var(--line)}.panel,.stage{background:var(--panel);min-width:0;overflow:auto}.panel{padding:17px 14px}.stage{background:#0f1116;display:flex;flex-direction:column;padding:16px 20px 0}.panel-title{color:var(--muted);font-size:12px;font-weight:800;margin:3px 5px 13px}.media-list{display:grid;gap:8px}.media-item{display:flex;align-items:center;gap:9px;padding:9px;border:1px solid var(--line);border-radius:10px;background:#191c23;cursor:pointer}.media-item.selected{border-color:var(--cyan)}.media-icon{width:35px;height:35px;border-radius:8px;display:grid;place-items:center;background:#26314b}.media-item.audio .media-icon{background:#532747}.media-name{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.media-meta{font-size:10px;color:var(--muted);margin-top:3px}.import{width:100%;border:1px dashed #4b556a;background:transparent;border-radius:10px;padding:10px;color:#d3d7e1;margin:10px 0 20px}.tools{display:grid;gap:5px}.tool{padding:10px;text-align:right;background:transparent;border-radius:9px;color:#c4cad5}.tool:hover,.tool.active{background:#242833;color:white}.tool span{display:inline-block;width:26px;color:var(--purple);font-weight:700}.stage-head{display:flex;justify-content:space-between;align-items:start}.stage-title{font-size:15px;font-weight:800}.stage-meta{font-size:11px;color:var(--muted);margin-top:4px}.preview{flex:1;min-height:260px;display:grid;place-items:center;position:relative}.phone{height:min(62vh,500px);aspect-ratio:9/16;border:8px solid #252a36;border-radius:24px;overflow:hidden;position:relative;background:linear-gradient(145deg,#d98955,#264b65 46%,#14182c);box-shadow:0 22px 60px #0009}.phone.empty-phone{background:#171a22}.phone.empty-phone:before{content:"أضف فيديو إلى الخط الزمني";position:absolute;inset:0;display:grid;place-items:center;color:#777f90;font-size:12px;text-align:center;padding:30px}.phone:after{content:"YOUR STORY";position:absolute;bottom:25%;left:0;right:0;text-align:center;font-weight:800;letter-spacing:3px;color:#fff;opacity:.8}.play{position:absolute;inset:0;display:grid;place-items:center;z-index:2}.play button{border:1px solid #fff8;background:#ffffff25;border-radius:50%;width:54px;height:54px;font-size:22px}.scrub{position:absolute;bottom:20px;left:15%;right:15%;height:3px;background:#fff5;border-radius:3px;z-index:3}.scrub i{display:block;width:35%;height:100%;background:#fff;position:relative}.scrub i:after{content:"";position:absolute;right:-5px;top:-4px;width:11px;height:11px;background:#fff;border-radius:50%}.controls{height:42px;display:flex;align-items:center;justify-content:center;gap:14px;color:#cbd0da}.time{font-size:11px;color:var(--muted);direction:ltr}.timeline{grid-column:1/-1;background:#111319;padding:10px 18px;position:relative;overflow:hidden}.timeline-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.timeline-title{font-size:12px;font-weight:800}.timeline-actions{display:flex;gap:6px}.mini{background:#252a35;border-radius:7px;padding:6px 9px;font-size:11px}.ruler{height:18px;display:flex;justify-content:space-between;color:#677084;font-size:10px;padding:0 10px;direction:ltr}.tracks{position:relative;display:grid;gap:6px;padding-left:10px;direction:ltr}.track{height:32px;background:#20242d;border:1px solid #2c313e;border-radius:6px;position:relative;overflow:hidden}.clip{position:absolute;top:3px;bottom:3px;padding:6px 9px;border-radius:5px;font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;color:#fff;cursor:pointer}.clip.video{background:linear-gradient(90deg,#5d40b9,#9a70e7)}.clip.audio{background:linear-gradient(90deg,#9c4d88,#dc7889)}.clip.selected{outline:2px solid var(--cyan);outline-offset:-1px}.playhead{position:absolute;top:-2px;bottom:0;width:2px;background:var(--red);z-index:3;left:30%}.playhead:before{content:"";position:absolute;top:-4px;left:-4px;border-left:5px solid transparent;border-right:5px solid transparent;border-top:6px solid var(--red)}.inspector h3{font-size:14px;margin:2px 4px 18px}.card{background:#191c24;border:1px solid var(--line);border-radius:11px;padding:13px;margin-bottom:9px}.row{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#b9c0cc;margin-bottom:13px}.row:last-child{margin-bottom:0}.val{color:#fff}.range{width:100%;accent-color:var(--purple)}.color{width:21px;height:21px;border-radius:6px;background:#ff6c7c}.mobile-nav{display:none}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:10}.modal-box{background:#171a22;border:1px solid var(--line);border-radius:15px;padding:20px;width:min(92vw,390px)}.modal h3{margin:0 0 14px}.modal input{width:100%;background:#0f1116;border:1px solid var(--line);color:#fff;border-radius:9px;padding:11px;outline:none}.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:15px}
@media(max-width:850px){.editor{grid-template-columns:210px minmax(280px,1fr)}.inspector{display:none}}@media(max-width:600px){.top{height:56px;padding:0 12px}.editor{height:calc(100vh - 56px);display:block}.panel{display:none}.stage{height:calc(100vh - 56px);padding:12px 10px 0}.phone{height:min(51vh,420px)}.timeline{position:absolute;left:0;right:0;bottom:58px;height:172px}.mobile-nav{position:fixed;display:flex;bottom:0;left:0;right:0;height:58px;background:#171922;border-top:1px solid var(--line);z-index:6;justify-content:space-around;align-items:center}.mobile-nav button{background:transparent;color:#9aa1b0;font-size:10px;display:grid;place-items:center;gap:3px}.mobile-nav b{font-size:19px;font-weight:400}.mobile-nav .active{color:#fff}.home{padding:22px 14px}.hero h1{font-size:28px}.hero{display:block}.hero .primary{margin-top:15px;width:100%}.projects{grid-template-columns:1fr 1fr}.project{min-height:160px;padding:11px}.thumb{height:65px}}
</style></head><body><div id="app"></div><input id="fileInput" type="file" accept="video/*,audio/*,image/*" multiple hidden>
<script>
const hasTauri=!!window.__TAURI_INTERNALS__;const invoke=window.__TAURI__?.core?.invoke||window.__TAURI_INTERNALS__?.invoke;let projects=[];let current=null;let selectedAsset=null;let selectedClip=null;let playing=false;let playTimer;
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);const fmt=s=>{s=Math.max(0,Math.round(s));return `00:${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`};
async function api(cmd,args){if(hasTauri&&invoke){try{return await invoke(cmd,args)}catch(e){console.warn(e)}}return null}
async function load(){const x=await api('list_projects');if(x){projects=x;return}try{projects=JSON.parse(localStorage.getItem('primer-projects')||'[]')}catch{projects=[]}}
async function persist(){const x=await api('save_project',{project:current});if(x)current=x;projects=[current,...projects.filter(p=>p.id!==current.id)];localStorage.setItem('primer-projects',JSON.stringify(projects))}
function home(){document.getElementById('app').innerHTML=`<header class="top"><div class="brand"><span class="logo">P</span>Primer Studio</div><div class="top-actions"><button class="btn" onclick="showAbout()">؟</button></div></header><main class="home"><div class="hero"><div><div class="eyebrow">CREATIVE VIDEO WORKSPACE</div><h1>مشاريعك</h1><p>أنشئ قصة جديدة أو تابع مشروعك من حيث توقفت.</p></div><button class="btn primary" onclick="newProject()">＋ مشروع جديد</button></div><div class="projects">${projects.length?projects.map(p=>`<article class="project"><div><div class="thumb">${p.assets?.length?'▶':'＋'}</div><h3>${esc(p.name)}</h3><small>${p.assets?.length||0} وسائط · آخر تعديل ${date(p.updated_at)}</small></div><div class="project-actions"><button onclick="openProject('${p.id}')">فتح المشروع</button><button class="danger" onclick="removeProject('${p.id}')">حذف</button></div></article>`).join(''):`<div class="empty"><b>لا توجد مشاريع بعد</b>ابدأ بمشروع فارغ ثم أضف الفيديو والصوت والصور إلى الخط الزمني.</div>`}</div></main>`}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function date(x){return x?new Date(x).toLocaleDateString('ar-EG',{month:'short',day:'numeric'}):'الآن'}
function modal(title,placeholder,action){document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><div class="modal-box"><h3>${title}</h3><input id="modalInput" placeholder="${placeholder}" value="مشروعي الجديد" autofocus><div class="modal-actions"><button class="btn" onclick="closeModal()">إلغاء</button><button class="btn primary" onclick="${action}">إنشاء</button></div></div></div>`);setTimeout(()=>document.getElementById('modalInput')?.focus(),50)}function closeModal(){document.getElementById('modal')?.remove()}
async function newProject(){modal('إنشاء مشروع فارغ','اسم المشروع','createProject()')}async function createProject(){const name=document.getElementById('modalInput').value.trim()||'مشروع جديد';closeModal();const x=await api('create_project',{name});current=x||{id:uid(),name,updated_at:new Date().toISOString(),duration:0,assets:[],clips:[]};if(!x){projects.unshift(current);localStorage.setItem('primer-projects',JSON.stringify(projects))}editor()}
async function removeProject(id){if(!confirm('حذف المشروع نهائيًا؟'))return;const x=await api('delete_project',{id});projects=projects.filter(p=>p.id!==id);localStorage.setItem('primer-projects',JSON.stringify(projects));home()}
function openProject(id){current=projects.find(p=>p.id===id);editor()}
function editor(){selectedAsset=null;selectedClip=null;document.getElementById('app').innerHTML=`<header class="top"><div class="brand"><button class="btn" onclick="goHome()">‹ المشاريع</button><span class="logo">P</span><b>${esc(current.name)}</b></div><div class="top-actions"><button class="btn" onclick="saveNow()">حفظ</button><button class="btn primary" onclick="exportProject()">تصدير</button></div></header><main class="editor"><aside class="panel"><div class="panel-title">مكتبة الوسائط</div><button class="import" onclick="pickFiles()">＋ استيراد فيديو / صوت / صورة</button><div id="mediaList" class="media-list"></div><div class="panel-title" style="margin-top:24px">أدوات</div><div class="tools"><button class="tool active" onclick="tool(this)"><span>◩</span>التحرير</button><button class="tool" onclick="splitClip()"><span>✂</span>تقسيم عند المؤشر</button><button class="tool" onclick="addText()"><span>T</span>نص وعناوين</button><button class="tool" onclick="tool(this)"><span>◒</span>فلاتر وألوان</button><button class="tool" onclick="tool(this)"><span>⌁</span>انتقالات</button></div></aside><section class="stage"><div class="stage-head"><div><div class="stage-title">المعاينة</div><div class="stage-meta">${current.assets.length?'1080 × 1920 · 30 إطار/ثانية':'مشروع فارغ · أضف أول وسائط'}</div></div><button class="btn" onclick="goHome()">×</button></div><div class="preview"><div class="phone ${current.clips.length?'':'empty-phone'}"><div class="play"><button onclick="togglePlay()">${playing?'Ⅱ':'▶'}</button></div><div class="scrub"><i></i></div></div></div><div class="controls"><span class="time" id="time">00:00:00 / ${fmt(current.duration||0)}</span><button class="btn" onclick="seek(-5)">↶</button><button class="btn primary" onclick="togglePlay()">${playing?'Ⅱ':'▶'}</button><button class="btn" onclick="seek(5)">↷</button></div></section><aside class="panel inspector"><h3>خصائص العنصر</h3><div id="inspectorContent"></div></aside><section class="timeline"><div class="timeline-head"><div class="timeline-title">الخط الزمني</div><div class="timeline-actions"><button class="mini" onclick="addSelectedToTimeline()">＋ إضافة للمسار</button><button class="mini" onclick="deleteSelected()">حذف</button></div></div><div class="ruler"><span>00:00</span><span>00:03</span><span>00:06</span><span>00:09</span><span>00:12</span></div><div class="tracks"><div class="playhead" id="playhead"></div><div class="track" id="videoTrack"></div><div class="track" id="audioTrack"></div></div></section></main><nav class="mobile-nav"><button class="active" onclick="goHome()"><b>◩</b>المشاريع</button><button onclick="pickFiles()"><b>＋</b>استيراد</button><button onclick="addSelectedToTimeline()"><b>▣</b>إضافة للمسار</button><button onclick="saveNow()"><b>✓</b>حفظ</button></nav>`;render()}
function render(){const list=document.getElementById('mediaList');if(!list)return;list.innerHTML=current.assets.length?current.assets.map(a=>`<div class="media-item ${selectedAsset?.id===a.id?'selected':''} ${a.kind==='audio'?'audio':''}" onclick="selectAsset('${a.id}')"><div class="media-icon">${a.kind==='audio'?'♪':a.kind==='image'?'▧':'▶'}</div><div><div class="media-name">${esc(a.name)}</div><div class="media-meta">${a.kind} · ${a.duration?fmt(a.duration):'جاهز للإضافة'}</div></div></div>`).join(''):'<div class="empty" style="padding:25px 10px">المكتبة فارغة<br>استورد ملفاتك للبدء.</div>';const vt=document.getElementById('videoTrack'),at=document.getElementById('audioTrack');if(vt){vt.innerHTML='';at.innerHTML='';current.clips.forEach(c=>{const el=document.createElement('div');el.className=`clip ${c.kind==='audio'?'audio':'video'} ${selectedClip?.id===c.id?'selected':''}`;el.style.left=(c.start/Math.max(current.duration||12,12)*100)+'%';el.style.width=Math.max(c.duration/Math.max(current.duration||12,12)*100,12)+'%';el.textContent=c.name;el.onclick=()=>{selectedClip=c;render()};(c.kind==='audio'?at:vt).appendChild(el)});updateInspector()}}
function selectAsset(id){selectedAsset=current.assets.find(a=>a.id===id);render();}function addSelectedToTimeline(){if(!selectedAsset){alert('اختر ملفًا من مكتبة الوسائط أولًا');return}const start=current.duration||0;const d=selectedAsset.duration||3;const clip={id:uid(),asset_id:selectedAsset.id,name:selectedAsset.name,kind:selectedAsset.kind,start,duration:d,track:selectedAsset.kind==='audio'?1:0,color:'#8c5cf5',volume:1};current.clips.push(clip);current.duration=Math.max(current.duration,start+d);selectedClip=clip;persist().then(render)}
function deleteSelected(){if(!selectedClip)return;current.clips=current.clips.filter(c=>c.id!==selectedClip.id);current.duration=current.clips.reduce((m,c)=>Math.max(m,c.start+c.duration),0);selectedClip=null;persist().then(render)}function splitClip(){if(!selectedClip){alert('اختر مقطعًا من الخط الزمني أولًا');return}if(selectedClip.duration<1){return}const half=selectedClip.duration/2;selectedClip.duration=half;const second={...selectedClip,id:uid(),name:selectedClip.name+' · 2',start:selectedClip.start+half};current.clips.push(second);persist().then(render)}function addText(){const c={id:uid(),asset_id:'text',name:'عنوان جديد',kind:'text',start:current.duration,duration:3,track:0,color:'#41d1d8',volume:1};current.clips.push(c);current.duration+=3;persist().then(render)}function updateInspector(){const box=document.getElementById('inspectorContent');if(!box)return;box.innerHTML=selectedClip?`<div class="card"><div class="row"><span>المقطع</span><span class="val">${esc(selectedClip.name)}</span></div><div class="row"><span>البداية</span><span class="val">${fmt(selectedClip.start)}</span></div><div class="row"><span>المدة</span><span class="val">${fmt(selectedClip.duration)}</span></div></div><div class="card"><div class="row"><span>مستوى الصوت</span><span class="val" id="volVal">${Math.round(selectedClip.volume*100)}%</span></div><input class="range" type="range" min="0" max="1" step=".01" value="${selectedClip.volume}" oninput="setVolume(this.value)"></div><div class="card"><div class="row"><span>المقياس</span><span class="val">100%</span></div><input class="range" type="range" min="50" max="150" value="100"></div>`:'<div class="empty" style="padding:25px 8px">اختر مقطعًا لعرض خصائصه</div>'}function setVolume(v){if(selectedClip){selectedClip.volume=Number(v);document.getElementById('volVal').textContent=Math.round(v*100)+'%';persist()}}function tool(el){document.querySelectorAll('.tool').forEach(x=>x.classList.remove('active'));el.classList.add('active')}
function pickFiles(){document.getElementById('fileInput').click()}document.getElementById('fileInput').onchange=e=>{[...e.target.files].forEach(f=>{const kind=f.type.startsWith('audio')?'audio':f.type.startsWith('image')?'image':'video';current.assets.push({id:uid(),name:f.name,kind,duration:kind==='audio'?8:5,size:f.size})});persist().then(render);e.target.value=''};
function togglePlay(){playing=!playing;clearInterval(playTimer);if(playing){playTimer=setInterval(()=>{const p=document.getElementById('playhead');if(!p)return;let left=parseFloat(p.style.left||30);left+=.5;if(left>95)left=5;p.style.left=left+'%';const t=document.getElementById('time');if(t)t.textContent=`00:00:${String(Math.floor(left/100*(current.duration||12))).padStart(2,'0')} / ${fmt(current.duration||0)}`},100)}editor()}
function seek(n){const p=document.getElementById('playhead');if(p){let l=parseFloat(p.style.left||30);p.style.left=Math.min(95,Math.max(5,l+n*3))+'%'}}async function saveNow(){await persist();alert('تم حفظ المشروع محليًا')}function exportProject(){alert('تم تجهيز المشروع للتصدير — MP4 · 1080p · جودة عالية')}function goHome(){clearInterval(playTimer);load().then(home)}function showAbout(){alert('Primer Studio — محرر فيديو محلي للموبايل\nالمشاريع تحفظ على جهازك داخل مساحة التطبيق.')}load().then(home);
</script></body></html>
